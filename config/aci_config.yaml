# =====================================================================
# CONFIGURACIÓN DE LA INTERFAZ AGENTE-COMPUTADORA (ACI) - SoftFactory
# =====================================================================

# 1. PLANTILLAS DE PROMPTS: Controlan cómo se muestran las observaciones al agente
system_template: |
  SETTING: You are an autonomous software engineering agent operating inside a sandboxed Linux Docker container.
  Your command line environment does NOT support interactive session commands (e.g., vi, nano, interactive python).
  Pay strict attention to proper indentation and line numbers when editing files.
  You must issue exactly a single thought and a single action/command per turn.

  AVAILABLE COMMANDS:
  {{command_docs}}

instance_template: |-
  TASK CONTEXT:
  Execute your assigned role SOP using the artifacts in `shared_pool/` and the rules in `config/workflow_context.json`.

  IMPORTANT TIPS:
  1. If you open a file and need to get to an area around a specific line that is not in the first 100 lines, say line 583, don't just use the `scroll_down` command multiple times. Instead, use the `goto 583` command.
  2. If a command did not work once, it will not work the second time unless you modify it!
  3. When editing files, it is easy to accidentally specify a wrong line number. Always check the code after you issue an edit.

next_step_template: |-
  {{observation}}
  (Open file: {{CURRENT_FILE}})
  (Current directory: {{pwd}})
  bash-$

next_step_no_output_template: |-
  Command ran successfully with no output.
  (Open file: {{CURRENT_FILE}})
  (Current directory: {{pwd}})
  bash-$

format_error_template: |-
  Your response could not be parsed or contained a blocked/invalid command.
  Please output your reasoning followed by a single valid command inside a bash block.

# 2. VARIABLES DE ESTADO DEL ENTORNO: Hacen que la interfaz tenga estado (stateful)
env_variables:
  CURRENT_FILE: "none"
  CURRENT_LINE: 1
  WINDOW_SIZE: 100
  OVERLAP: 2
  MAX_SEARCH_RESULTS: 50

state_command:
  name: "_state"
  code: |
    _state() {
      echo "{\"pwd\": \"$PWD\", \"CURRENT_FILE\": \"$CURRENT_FILE\", \"CURRENT_LINE\": $CURRENT_LINE}"
    }

# 3. ARCHIVOS DE COMANDOS (Tool Bundles)
command_files:
  - "tools/file_viewer/windowed_viewer.sh"
  - "tools/search_nav/search_tools.sh"
  - "tools/file_editor/edit_linting.sh"

# 4. FLUJO DE CONTROL Y GESTIÓN DE CONTEXTO
parse_function:
  type: "ThoughtActionParser"
  max_requeries: 3
  blocked_commands:
    - "vim"
    - "vi"
    - "nano"
    - "less"
    - "more"
    - "top"

history_processor:
  - type: "cache_control"
    last_n_messages: 2
  - type: "last_n_observations"
    n: 5
    